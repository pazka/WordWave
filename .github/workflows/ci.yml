name: ci
# Upgrade safety net (see TESTING.md). Every PR (incl. Dependabot), main, and agent/** branches
# (an agent gets CI without opening a PR). Builds nothing that is pushed.
on:
  pull_request:
  push:
    branches: [main, 'agent/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server:
    name: server tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    container: python:${{ matrix.python }}-slim
    # 3.14 = the image; 3.11 kept as the previous runtime. Both are gates.
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: pip install --no-cache-dir -r COMServer/requirements.txt
      - run: python -m unittest discover -s tests -v
        working-directory: COMServer

  fronts:
    name: front builds (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    container: node:${{ matrix.node }}-alpine
    strategy:
      fail-fast: false
      matrix:
        node: ['26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: WordWaveWeb (webpack)
        working-directory: WordWaveWeb
        run: npm ci --no-audit --no-fund && npm run build && test -s dist/index.html
      - name: Speech2TextWeb (CRA)
        working-directory: Speech2TextWeb
        # CI=false like the Docker build: with CI=true react-scripts turns the existing lint
        # warnings (UTF-8 BOMs, one unused var) into errors. See TESTING.md.
        run: npm ci --no-audit --no-fund && CI=false npm run build && test -s build/index.html
      - name: Speech2TextWeb admin features in the bundle
        run: sh scripts/check-admin-bundle.sh Speech2TextWeb/build

  smoke:
    name: container smoke
    needs: [server, fronts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: wordwave:smoke
      - run: bash scripts/smoke.sh wordwave:smoke
      # The box's legacy compose, unchanged (tests/compose/legacy.yml): capability incl. a Socket.IO
      # broadcast and the word log surviving a container restart.
      - name: Compat - legacy box compose
        run: bash scripts/compat-smoke.sh legacy wordwave:smoke
      # The hosh-deploy compose (docker-compose.example.yml + .env.example as on the box): uid 10001,
      # read-only rootfs, PORT=8000, word log in the wordwave-data volume, register checks, POST_DEPLOY.
      - name: Compat - hosh-deploy compose (box standard)
        run: bash scripts/compat-smoke.sh template wordwave:smoke
      # Node guardrail (pazka/hosh-management#5, CVE-2026-111497). Node only exists in the two
      # front build stages (the runtime is python), so those stages are built and checked.
      - name: Node guardrail on the build stages
        run: |
          set -euo pipefail
          for stage in wordwave-web admin-web; do
            docker buildx build --target "$stage" --load -t "wordwave-$stage:check" .
            bash scripts/check-node-version.sh "wordwave-$stage:check"
          done
      - name: Runtime image ships no Node (else the guardrail must check it too)
        run: |
          if docker run --rm --network none --entrypoint node wordwave:smoke -v; then
            echo "::error::wordwave:smoke now contains node: run scripts/check-node-version.sh on it"
            exit 1
          fi
      - name: Guardrail test - it rejects an unpatched Node (24.21.0)
        run: '! bash scripts/check-node-version.sh node:24.21.0-alpine'
