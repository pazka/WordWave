# Tested minor/patch updates merge themselves (workflows/dependabot-merge.yml, box standard
# hosh-migration Decision #18); majors get "needs-review". 7-day cooldown (Decision #17).
version: 2
updates:
  - package-ecosystem: docker
    directory: "/"
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
  # One PR for all action bumps: separate PRs editing the same workflows conflict once one is merged.
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
  # The server pins 2021 versions; refreshing them is what unblocks Python 3.14 (TESTING.md).
  - package-ecosystem: pip
    directory: "/COMServer"
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 5
    groups:
      pip-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directories: ["/WordWaveWeb", "/Speech2TextWeb"]
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 3
    groups:
      # react and react-dom peer-pin each other: bumped alone, either one fails npm ci (ERESOLVE, #23).
      react:
        patterns: ["react", "react-dom", "@testing-library/react", "@types/react", "@types/react-dom"]
      npm-minor-patch:
        update-types: [minor, patch]
