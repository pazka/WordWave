version: 2
updates:
  - package-ecosystem: docker
    directory: "/"
    schedule: { interval: monthly }
  # One PR for all action bumps: separate PRs editing the same workflows conflict once one is merged.
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: monthly }
    groups:
      actions:
        patterns: ["*"]
  # The server pins 2021 versions; refreshing them is what unblocks Python 3.14 (TESTING.md).
  - package-ecosystem: pip
    directory: "/COMServer"
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    groups:
      pip-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directories: ["/WordWaveWeb", "/Speech2TextWeb"]
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
