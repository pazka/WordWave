# Read ONCE by `hosh-deploy register wordwave` on the box (box standard, Decision #16), which validates
# the compose hardening and pins the result in /etc/hosh-deploy/apps/wordwave.conf. Changing this file
# in the repo changes nothing on the box until someone re-registers there.
SERVICE=wordwave
IMAGE_REPO=ghcr.io/pazka/wordwave
IMAGE_VAR=WORDWAVE_IMAGE
ENV_FILE=wordwave.env
HOST=wordwave.hosh.it
BIND=127.0.0.1:9140
HEALTH=/healthz
# Capability smoke INSIDE the container after each deploy (non-zero ⇒ auto-rollback). Read-only: web
# builds, open data, POST /login with the container's LOGIN/MDP, Socket.IO session + namespace join.
# It never posts words (that would reach the live installation).
POST_DEPLOY=python /selfcheck.py http://127.0.0.1:8000
REPO=pazka/WordWave
